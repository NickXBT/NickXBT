<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 190" width="660" height="190">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&amp;display=swap');
      .font-mono { font-family: 'Fira Code', monospace; }

      /* Pickaxe Swing Animation */
      @keyframes pickaxeSwing {
        0%, 100% { transform: rotate(0deg); }
        40% { transform: rotate(-55deg); }
        50% { transform: rotate(15deg); }
      }
      .pickaxe-hand { transform-origin: 160px 105px; animation: pickaxeSwing 1.4s ease-in-out infinite; }

      /* Block Mining Crack Sparkles */
      @keyframes sparkBurst {
        0%, 100% { transform: scale(0.6) rotate(0deg); opacity: 0.2; }
        50% { transform: scale(1.3) rotate(180deg); opacity: 1; fill: #f7931a; }
      }
      .spark-1 { animation: sparkBurst 1.4s infinite ease-in-out; }
      .spark-2 { animation: sparkBurst 1.4s infinite ease-in-out 0.2s; }
      
      /* Coin Float & Pulse */
      @keyframes coinFloat {
        0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 3px #f7931a); }
        50% { transform: translateY(-14px) scale(1.15); filter: drop-shadow(0 0 10px #f7931a); }
      }
      .btc-coin { animation: coinFloat 2s ease-in-out infinite; }
      
      @keyframes ethFloat {
        0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 3px #627eea); }
        50% { transform: translateY(-14px) scale(1.15); filter: drop-shadow(0 0 10px #627eea); }
      }
      .eth-coin { animation: ethFloat 2.2s ease-in-out infinite 0.4s; }

      /* Ticker Text Scroll */
      @keyframes tickerSlide {
        0% { transform: translateX(500px); }
        100% { transform: translateX(-500px); }
      }
      .ticker-wrap { animation: tickerSlide 14s linear infinite; }
    </style>
    
    <!-- Bitcoin Gold Glow -->
    <linearGradient id="btcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7931a" />
      <stop offset="100%" stop-color="#ffb74d" />
    </linearGradient>
    
    <!-- Ethereum Purple-Blue Glow -->
    <linearGradient id="ethGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#627eea" />
      <stop offset="100%" stop-color="#8a9ba8" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect x="5" y="5" width="650" height="180" rx="10" ry="10" fill="#0d1117" stroke="#f7931a" stroke-width="1.5" />

  <!-- Top Header Ticker Bar -->
  <rect x="5" y="5" width="650" height="30" rx="10" ry="10" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
  <rect x="6" y="22" width="648" height="12" fill="#161b22" />

  <!-- Ticker Content -->
  <g clip-path="url(#ticker-clip)">
    <clipPath id="ticker-clip">
      <rect x="20" y="8" width="620" height="22" />
    </clipPath>
    <g class="ticker-wrap">
      <text x="0" y="24" class="font-mono" font-size="11" font-weight="700" fill="#00ff87">
        MINECRAFT BLOCKCHAIN MINER  |  <tspan fill="#f7931a">BTC: $98,450 +5.8%</tspan>  |  <tspan fill="#627eea">ETH: $3,680 +8.4%</tspan>  |  <tspan fill="#14f195">SOL: $245 +14.2%</tspan>  |  <tspan fill="#00ff87">BLOCK #874,920 MINED [PROOF-OF-WORK]</tspan>
      </text>
    </g>
  </g>

  <!-- Ground Blockchain Track -->
  <rect x="5" y="155" width="650" height="25" fill="#1a1d24" />
  <!-- Cyan Circuit Line on Ground -->
  <line x1="5" y1="155" x2="655" y2="155" stroke="#f7931a" stroke-width="2" />
  <path d="M 10 162 L 650 162" stroke="#627eea" stroke-width="1" stroke-dasharray="12 8" />

  <!-- 1. MINECRAFT STEVE CRYPTO MINER (Left Side) -->
  <g id="steve-miner" transform="translate(40, 45)">
    <!-- Steve Head -->
    <rect x="120" y="45" width="20" height="20" fill="#c0a080" />
    <rect x="120" y="45" width="20" height="6" fill="#4a2e16" />
    <!-- Eyes -->
    <rect x="123" y="54" width="4" height="3" fill="#ffffff" />
    <rect x="125" y="54" width="2" height="3" fill="#2b4c7e" />
    <rect x="133" y="54" width="4" height="3" fill="#ffffff" />
    <rect x="133" y="54" width="2" height="3" fill="#2b4c7e" />
    
    <!-- Torso (Cyan Shirt) -->
    <rect x="120" y="65" width="20" height="25" fill="#00a8a8" />
    
    <!-- Legs (Blue Pants) -->
    <rect x="121" y="90" width="8" height="20" fill="#2a3b8f" />
    <rect x="131" y="90" width="8" height="20" fill="#2a3b8f" />
    <rect x="121" y="106" width="8" height="4" fill="#4a4a4a" />
    <rect x="131" y="106" width="8" height="4" fill="#4a4a4a" />

    <!-- Swinging Diamond/Crypto Pickaxe -->
    <g class="pickaxe-hand">
      <!-- Arm -->
      <rect x="138" y="65" width="8" height="20" fill="#00a8a8" />
      <rect x="138" y="80" width="8" height="6" fill="#c0a080" />
      <!-- Pickaxe Handle -->
      <rect x="144" y="60" width="4" height="35" fill="#7a4b2a" transform="rotate(-30 144 60)" />
      <!-- Pickaxe Diamond Head -->
      <path d="M 130 42 L 158 32 L 164 45 L 138 52 Z" fill="#00f0ff" stroke="#ffffff" stroke-width="1" />
    </g>
  </g>

  <!-- 2. MINECRAFT BITCOIN ORE BLOCK & FLOATING COIN (Center) -->
  <g id="bitcoin-block" transform="translate(260, 60)">
    <!-- Minecraft Pixel Ore Block Body -->
    <rect x="0" y="35" width="55" height="55" fill="#3a3d45" stroke="#f7931a" stroke-width="2" rx="4" />
    <!-- Gold Ore Speckles inside Block -->
    <rect x="10" y="45" width="8" height="8" fill="#f7931a" />
    <rect x="32" y="42" width="10" height="8" fill="#ffb74d" />
    <rect x="14" y="68" width="12" height="8" fill="#f7931a" />
    <rect x="34" y="70" width="8" height="10" fill="#ffb74d" />

    <!-- Mining Sparks -->
    <g class="spark-1" transform="translate(-10, 30)">
      <polygon points="5,0 8,5 5,10 2,5" fill="#f7931a" />
    </g>
    <g class="spark-2" transform="translate(5, 20)">
      <polygon points="5,0 8,5 5,10 2,5" fill="#ffffff" />
    </g>

    <!-- Floating Bitcoin Coin -->
    <g class="btc-coin" transform="translate(10, -25)">
      <circle cx="18" cy="18" r="18" fill="url(#btcGrad)" stroke="#ffffff" stroke-width="1.5" />
      <text x="18" y="24" class="font-mono" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
    </g>
    <text x="27" y="105" class="font-mono" font-size="9" font-weight="700" fill="#f7931a" text-anchor="middle">BTC ORE</text>
  </g>

  <!-- 3. MINECRAFT ETHEREUM ORE BLOCK & FLOATING COIN (Right-Center) -->
  <g id="ethereum-block" transform="translate(420, 60)">
    <!-- Minecraft Pixel Ore Block Body -->
    <rect x="0" y="35" width="55" height="55" fill="#2b2d35" stroke="#627eea" stroke-width="2" rx="4" />
    <!-- Ethereum Purple Speckles -->
    <rect x="12" y="42" width="10" height="8" fill="#627eea" />
    <rect x="30" y="48" width="8" height="10" fill="#8a9ba8" />
    <rect x="10" y="66" width="10" height="10" fill="#627eea" />
    <rect x="32" y="68" width="10" height="8" fill="#8a9ba8" />

    <!-- Floating Ethereum Coin -->
    <g class="eth-coin" transform="translate(10, -25)">
      <circle cx="18" cy="18" r="18" fill="url(#ethGrad)" stroke="#ffffff" stroke-width="1.5" />
      <text x="18" y="24" class="font-mono" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">E</text>
    </g>
    <text x="27" y="105" class="font-mono" font-size="9" font-weight="700" fill="#627eea" text-anchor="middle">ETH ORE</text>
  </g>

  <!-- 4. MINECRAFT CHEST FULL OF CRYPTO (Right Side) -->
  <g id="crypto-chest" transform="translate(560, 80)">
    <!-- Chest Body -->
    <rect x="0" y="20" width="45" height="35" fill="#8b5a2b" stroke="#000000" stroke-width="2" rx="2" />
    <rect x="0" y="20" width="45" height="10" fill="#a06d3b" />
    <rect x="18" y="26" width="9" height="8" fill="#f7931a" stroke="#000000" stroke-width="1" />
    <text x="22" y="68" class="font-mono" font-size="9" font-weight="700" fill="#00ff87" text-anchor="middle">VAULT</text>
  </g>

</svg>